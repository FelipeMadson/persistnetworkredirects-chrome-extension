<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d14" />
      <stop offset="100%" stop-color="#020509" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c28" />
      <stop offset="100%" stop-color="#0d141f" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#canvasBg); stroke: #1e293b; stroke-width: 1.5; rx: 14px; }
    .header-bar { fill: #0d131f; stroke-bottom: #1e293b; }
    .card { fill: url(#cardGrad); stroke: #26354a; stroke-width: 1.2; rx: 8px; }
    .card-active { fill: url(#cardGrad); stroke: #06b6d4; stroke-width: 1.5; rx: 8px; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .text-subtitle { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #94a3b8; }
    .text-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #64748b; font-weight: 600; }
    .badge { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; fill: #38bdf8; }
    .arrow { stroke: #38bdf8; stroke-width: 1.8; stroke-dasharray: 4, 3; fill: none; }
    .arrow-solid { stroke: #06b6d4; stroke-width: 2; fill: none; }
    .pulse-dot { fill: #06b6d4; }
  </style>

  <!-- Container Principal -->
  <g filter="url(#shadow)">
    <rect x="15" y="15" width="930" height="390" rx="14" class="bg" />
    
    <!-- Header -->
    <path d="M 15 29 A 14 14 0 0 1 29 15 L 931 15 A 14 14 0 0 1 945 29 L 945 58 L 15 58 Z" class="header-bar" />
    <circle cx="38" cy="36" r="5" fill="#ef4444" />
    <circle cx="54" cy="36" r="5" fill="#f59e0b" />
    <circle cx="70" cy="36" r="5" fill="#10b981" />
    
    <text x="96" y="40" class="text-title">Persistnetworkredirects Chrome Extension</text>
    <text x="440" y="40" class="badge">ARQUITETURA &amp; PIPELINE DE DADOS · [CHROME EXTENSION MANIFEST V3 ARCHITECTURE]</text>
    <text x="820" y="40" class="text-label">FELIPE MADISON</text>

    <!-- Conteúdo Específico do Arquétipo -->
    
    <!-- 1. Omnibox & URL Navigation -->
    <g transform="translate(45, 95)">
      <rect width="180" height="260" class="card" />
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#1e293b" />
      <text x="14" y="21" class="text-title">1. Omnibox Navigation</text>
      <text x="14" y="65" class="text-subtitle">Interceptação de Rede</text>
      <text x="14" y="90" class="text-label">• URL Navigation Event</text>
      <text x="14" y="110" class="text-label">• Active Tab Context</text>
      <text x="14" y="130" class="text-label">• RegEx Pattern Match</text>
      <rect x="14" y="165" width="152" height="70" rx="6" fill="#090d14" stroke="#f59e0b" />
      <text x="24" y="190" class="badge">Manifest V3</text>
      <text x="24" y="208" class="text-label">Declarative Engine</text>
      <text x="24" y="223" class="text-label">No blocking scripts</text>
    </g>

    <path d="M 225 225 L 275 225" class="arrow-solid" />
    <polygon points="275,221 283,225 275,229" fill="#06b6d4" />

    <!-- 2. MV3 Service Worker -->
    <g transform="translate(285, 80)">
      <rect width="210" height="290" class="card-active" />
      <rect x="0" y="0" width="210" height="32" rx="8" fill="#c2410c" />
      <text x="14" y="21" class="text-title">2. MV3 Service Worker</text>
      <text x="14" y="60" class="text-subtitle">Background Worker</text>

      <rect x="14" y="75" width="182" height="48" rx="4" fill="#090d14" stroke="#ea580c" />
      <text x="24" y="95" class="text-title" fill="#fdba74">declarativeNetRequest</text>
      <text x="24" y="112" class="text-label">Dynamic redirect rules</text>

      <rect x="14" y="135" width="182" height="48" rx="4" fill="#090d14" stroke="#38bdf8" />
      <text x="24" y="155" class="text-title" fill="#38bdf8">chrome.storage.local</text>
      <text x="24" y="172" class="text-label">Persistent redirect logs</text>

      <rect x="14" y="195" width="182" height="48" rx="4" fill="#090d14" stroke="#10b981" />
      <text x="24" y="215" class="text-title" fill="#10b981">Event-Driven Lifecycle</text>
      <text x="24" y="232" class="text-label">Zero memory leak / idle sleep</text>
    </g>

    <path d="M 495 225 L 545 225" class="arrow-solid" />
    <polygon points="545,221 553,225 545,229" fill="#06b6d4" />

    <!-- 3. Extension Toolbar & Popup -->
    <g transform="translate(555, 95)">
      <rect width="180" height="260" class="card" />
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#1e293b" />
      <text x="14" y="21" class="text-title">3. Extension Popup UI</text>
      <text x="14" y="65" class="text-subtitle">Interface do Usuário</text>
      <text x="14" y="90" class="text-label">• Action Badge Counter</text>
      <text x="14" y="110" class="text-label">• Rule List &amp; Switches</text>
      <text x="14" y="130" class="text-label">• Live Intercept Audit</text>
      <rect x="14" y="165" width="152" height="70" rx="6" fill="#090d14" stroke="#38bdf8" />
      <text x="24" y="190" class="badge">1-Click JSON Export</text>
      <text x="24" y="208" class="text-label">Manifest V3 Spec</text>
      <text x="24" y="223" class="text-label">Compatível com CWS</text>
    </g>

    <path d="M 735 225 L 775 225" class="arrow-solid" />
    <polygon points="775,221 783,225 775,229" fill="#06b6d4" />

    <!-- 4. Target Redirect Engine -->
    <g transform="translate(785, 95)">
      <rect width="130" height="260" class="card" />
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" />
      <text x="12" y="21" class="text-title">4. Destino Final</text>
      <text x="12" y="65" class="text-subtitle">Redirecionamento</text>
      <text x="12" y="95" class="badge">Rewrite 307</text>
      <text x="12" y="115" class="text-label">Modificação de Query</text>
      <text x="12" y="145" class="badge">Zero Latência</text>
      <text x="12" y="165" class="text-label">Nível de Kernel / V8</text>
      <text x="12" y="200" class="text-title" fill="#10b981">Seguro &amp; Aud.</text>
      <text x="12" y="220" class="text-label">100% Determinístico</text>
    </g>
  </g>
</svg>